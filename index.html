<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Film Reccomendation Page</title>
    <link href="final.css" rel="stylesheet" type="text/css">
</head>
<body>
<div class="top-icons">
    <img src="https://static.vecteezy.com/system/resources/thumbnails/076/803/627/small/retro-pixel-art-clapperboard-icon-for-movie-film-production-slate-png.png">
    <img src="https://static.vecteezy.com/system/resources/previews/076/803/632/non_2x/retro-pixel-art-wavy-film-strip-reel-icon-for-movie-media-element-png.png">
    <img src= "https://static.vecteezy.com/system/resources/previews/076/803/625/non_2x/retro-pixel-art-camera-icon-on-tripod-for-movie-production-png.png">
</div>
    <h1> YOUR RYAN GOSLING MOVIE </h1>
    <h2> Pick a genre! </h2>
 
 <button id="startBtn">START</button>

<div id="genreSection">
    <p>
    <label for="genres">What's your genre?</label>
    </p>
    <select id="genres">
        <option value="action">Action</option>
        <option value="barbie">Barbie is its own genre</option>
        <option value="comedy">Comedy</option>
        <option value="crime">Crime</option>
        <option value="musical">Musical</option>
        <option value="mystery">Mystery</option>
        <option value="romance">Romance</option>
        <option value="sci-fi">Sci-Fi</option>
    </select>
</div>
<div class="ryan-gallery">
    <img src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyMHdoYXpsdDE0a3B0OHk5bmNzNnoxdm9sbjJhMmZ5c2xram93NHJsMiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/Proa54AFQTtsye9DI0/giphy.gif" alt="ryan1">
    
    <img src="https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUycWFwc2trdjNkeWF4MHlsenZuNGZ1NzRuenFxeWFzeXZvc29keXU0ZyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/8na4eskcwQ3H8Y4OxN/giphy.gif" alt="ryan3">
  </div>
    
 <div id="popupBox" class="popup">
    <span id="closePopup" class="closeBtn">&times;</span>

    <div class="popup-content">
        <img id="popupImage" src="" alt="movie image">

        <div class="popup-text">
            <p id="popupText"></p>
        </div>
    </div>
</div>
       <script src="final.js"></script>
</body>
</html>
